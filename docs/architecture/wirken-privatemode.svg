<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 460" role="img">
<title>Wirken and Privatemode architecture</title>
<desc>Three trust zones: comms channels feed messages into the Wirken gateway, which routes inference requests through a local Privatemode proxy to confidential backend inference.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.box { fill: #fff; stroke: #888780; }
.t { font: 400 14px "Inter", system-ui, sans-serif; fill: #2C2C2A; }
.ts { font: 400 12px "Inter", system-ui, sans-serif; fill: #5F5E5A; }
.th { font: 500 14px "Inter", system-ui, sans-serif; fill: #2C2C2A; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
.c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal .th { fill: #085041; }
.c-teal .ts { fill: #0F6E56; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple .th { fill: #3C3489; }
.c-purple .ts { fill: #534AB7; }
@media (prefers-color-scheme: dark) {
.box { fill: #2C2C2A; stroke: #B4B2A9; }
.t, .th { fill: #F1EFE8; }
.ts { fill: #D3D1C7; }
.arr { stroke: #B4B2A9; }
.c-gray rect { fill: #444441; stroke: #D3D1C7; }
.c-teal rect { fill: #085041; stroke: #9FE1CB; }
.c-teal .th { fill: #E1F5EE; }
.c-teal .ts { fill: #9FE1CB; }
.c-purple rect { fill: #3C3489; stroke: #CECBF6; }
.c-purple .th { fill: #EEEDFE; }
.c-purple .ts { fill: #CECBF6; }
}
</style>
</defs>
<g class="c-gray">
<rect x="20" y="40" width="160" height="380" rx="14" stroke-width="0.5"/>
<text class="th" x="100" y="70" text-anchor="middle">Comms channels</text>
<text class="ts" x="100" y="88" text-anchor="middle">9 adapters total</text>
</g>
<rect class="box" x="40" y="110" width="120" height="36" rx="6" stroke-width="0.5"/>
<text class="t" x="100" y="128" text-anchor="middle" dominant-baseline="central">Signal</text>
<rect class="box" x="40" y="154" width="120" height="36" rx="6" stroke-width="0.5"/>
<text class="t" x="100" y="172" text-anchor="middle" dominant-baseline="central">Slack</text>
<rect class="box" x="40" y="198" width="120" height="36" rx="6" stroke-width="0.5"/>
<text class="t" x="100" y="216" text-anchor="middle" dominant-baseline="central">Teams</text>
<rect class="box" x="40" y="242" width="120" height="36" rx="6" stroke-width="0.5"/>
<text class="t" x="100" y="260" text-anchor="middle" dominant-baseline="central">Matrix</text>
<rect class="box" x="40" y="286" width="120" height="36" rx="6" stroke-width="0.5"/>
<text class="t" x="100" y="304" text-anchor="middle" dominant-baseline="central">iMessage</text>
<text class="ts" x="100" y="348" text-anchor="middle">+ Telegram, Discord,</text>
<text class="ts" x="100" y="366" text-anchor="middle">WhatsApp, Google Chat</text>
<g class="c-teal">
<rect x="200" y="40" width="280" height="380" rx="14" stroke-width="0.5"/>
<text class="th" x="340" y="70" text-anchor="middle">Wirken gateway</text>
<text class="ts" x="340" y="88" text-anchor="middle">Per-channel process isolation</text>
</g>
<rect class="box" x="220" y="115" width="240" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="340" y="131" text-anchor="middle" dominant-baseline="central">Channel adapters</text>
<text class="ts" x="340" y="149" text-anchor="middle" dominant-baseline="central">Ed25519 authentication</text>
<rect class="box" x="220" y="175" width="240" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="340" y="191" text-anchor="middle" dominant-baseline="central">Permission store</text>
<text class="ts" x="340" y="209" text-anchor="middle" dominant-baseline="central">Approvals, denials logged</text>
<rect class="box" x="220" y="235" width="240" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="340" y="251" text-anchor="middle" dominant-baseline="central">Credential vault</text>
<text class="ts" x="340" y="269" text-anchor="middle" dominant-baseline="central">XChaCha20-Poly1305</text>
<rect class="box" x="220" y="295" width="240" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="340" y="311" text-anchor="middle" dominant-baseline="central">Skills in gVisor</text>
<text class="ts" x="340" y="329" text-anchor="middle" dominant-baseline="central">Tool execution sandbox</text>
<rect class="box" x="220" y="355" width="240" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="340" y="371" text-anchor="middle" dominant-baseline="central">Audit log</text>
<text class="ts" x="340" y="389" text-anchor="middle" dominant-baseline="central">Hash-chained sessions</text>
<g class="c-purple">
<rect x="500" y="40" width="160" height="380" rx="14" stroke-width="0.5"/>
<text class="th" x="580" y="70" text-anchor="middle">Privatemode</text>
<text class="ts" x="580" y="88" text-anchor="middle">Confidential AI</text>
</g>
<rect class="box" x="520" y="130" width="120" height="60" rx="6" stroke-width="0.5"/>
<text class="th" x="580" y="151" text-anchor="middle" dominant-baseline="central">Local proxy</text>
<text class="ts" x="580" y="170" text-anchor="middle" dominant-baseline="central">Port 8080</text>
<rect class="box" x="520" y="260" width="120" height="60" rx="6" stroke-width="0.5"/>
<text class="th" x="580" y="281" text-anchor="middle" dominant-baseline="central">Kimi K2.5</text>
<text class="ts" x="580" y="300" text-anchor="middle" dominant-baseline="central">H100 in TEE</text>
<text class="ts" x="580" y="225" text-anchor="middle">attestation</text>
<line x1="580" y1="195" x2="580" y2="255" class="arr" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="182" y1="225" x2="198" y2="225" class="arr" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="482" y1="225" x2="498" y2="225" class="arr" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
</svg>
