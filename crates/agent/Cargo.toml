[package]
name = "wirken-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wirken agent runtime: LLM dispatch, tool execution, context engine, reproducible session replay."

[dependencies]
wirken-audit = { path = "../audit" }
wirken-ipc = { path = "../ipc" }
wirken-gateway = { path = "../gateway" }
wirken-mcp-proxy = { path = "../mcp-proxy" }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
lru = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
toml = "1.1"
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.23"
bollard = { workspace = true }
wasmtime = { workspace = true }
# Must move in lockstep with the workspace `wasmtime` pin; the two
# crates share an API surface and a mismatched pair does not compile.
# See the security-floor note in the workspace Cargo.toml.
wasmtime-wasi = "47.0.3"
futures-util = "0.3"
async-trait = { workspace = true }
capnp = { workspace = true }
# Capability-based filesystem handle for the agent workspace. Opened
# once at ToolRegistry construction, then all read/write/list ops go
# through Dir methods that refuse paths escaping the workspace. Used
# instead of hand-rolled canonicalize + symlink_metadata checks.
cap-std = "4.0"
# Read-only SQLite handle for the `sqlite_query` librarian tool. The
# tool opens a per-call connection with `SQLITE_OPEN_READ_ONLY` so
# writes are refused at the connection layer, not by string-pattern
# checks on the SQL.
rusqlite = { workspace = true }
# Tinfoil confidential-inference SDK. Three-step verification (AMD
# SEV-SNP attestation + Sigstore code provenance + measurement
# comparison) bundled into client construction; the returned client
# exposes a TLS-fingerprint-pinned `reqwest::Client` via
# `http_client()` that wirken's tinfoil dispatch uses for chat traffic.
# Pinned to v0.1.0; no crates.io publish exists yet. AGPL-3.0 license
# is carved out for this crate in `deny.toml`.
tinfoil = { git = "https://github.com/tinfoilsh/tinfoil-rs", tag = "v0.1.1" }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
