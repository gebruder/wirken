[package]
name = "wirken-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wirken agent runtime: LLM dispatch, tool execution, context engine, reproducible session replay."

[dependencies]
wirken-audit = { path = "../audit" }
wirken-ipc = { path = "../ipc" }
wirken-gateway = { path = "../gateway" }
wirken-mcp-proxy = { path = "../mcp-proxy" }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
lru = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
bollard = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = "43.0.1"
futures-util = "0.3"
# Capability-based filesystem handle for the agent workspace. Opened
# once at ToolRegistry construction, then all read/write/list ops go
# through Dir methods that refuse paths escaping the workspace. Used
# instead of hand-rolled canonicalize + symlink_metadata checks.
cap-std = "3.4"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
