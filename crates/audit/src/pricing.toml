# Per-model token pricing baked into the audit crate via include_str! at
# compile time. Keyed by (provider, model) exactly as the audit chain
# records them on SessionEvent::LlmRequest.
#
# A pair missing from this table yields cost_micros=None on the
# emitted SessionEvent::LlmResponse and a tracing::warn at the emit
# site. Calls do not fail.
#
# Prices are USD per million tokens, parsed as f64 and converted to
# micros at lookup time. Update on model release or vendor price
# change; bumping these is a version-bump change because the audit
# chain captures the cost the binary was built against.
#
# Local-only providers (ollama, tinfoil enclave dispatch where the
# operator runs the hardware) have no per-token vendor cost and are
# intentionally absent. The Privatemode OpenAI-compat endpoint is
# tenant-priced and also absent; operators can add entries to a
# vendored fork if they want per-call cost on it.

[[entries]]
provider = "anthropic"
model = "claude-opus-4-5"
input_per_million_usd = 15.0
output_per_million_usd = 75.0

[[entries]]
provider = "anthropic"
model = "claude-opus-4-7"
input_per_million_usd = 15.0
output_per_million_usd = 75.0

