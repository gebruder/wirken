[package]
name = "wirken-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wirken command-line interface and long-running gateway daemon."

[[bin]]
name = "wirken"
path = "src/main.rs"

[dependencies]
wirken-vault = { path = "../vault" }
wirken-audit = { path = "../audit" }
wirken-gateway = { path = "../gateway" }
wirken-agent = { path = "../agent" }
wirken-zirkel = { path = "../zirkel" }
wirken-ipc = { path = "../ipc" }
wirken-mcp-proxy = { path = "../mcp-proxy" }
wirken-adapter-telegram = { path = "../adapter-telegram" }
wirken-adapter-discord = { path = "../adapter-discord" }
wirken-adapter-slack = { path = "../adapter-slack" }
wirken-adapter-teams = { path = "../adapter-teams" }
wirken-adapter-matrix = { path = "../adapter-matrix" }
wirken-adapter-whatsapp = { path = "../adapter-whatsapp" }
wirken-adapter-signal = { path = "../adapter-signal" }
wirken-adapter-google-chat = { path = "../adapter-google-chat" }
wirken-adapter-imessage = { path = "../adapter-imessage" }
capnp = { workspace = true }
ed25519-dalek = { workspace = true }
uuid = { version = "1", features = ["v4"] }
reqwest = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
console = "0.16"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
# Used by `wirken skills migrate` for round-tripping YAML frontmatter
# through `serde_yaml::Value` so the migration can splice individual
# keys without losing unknown fields. Already a transitive dep through
# wirken-agent, listed directly here so the cli can pull it.
serde_yaml = "0.9"
openssl = { workspace = true }
libc = "0.2"
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
