[package]
name = "wirken-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Encrypted credential vault for Wirken: XChaCha20-Poly1305 at rest, OS-keychain-keyed, with per-credential rotation metadata."

[features]
default = ["keychain-age"]
keychain-macos = ["dep:security-framework"]
# secret-service pulls zbus with default-features = false, so the zbus
# runtime and the crypto backend are both selected here. The workspace
# runs on tokio; crypto-rust keeps the backend in-tree rather than
# linking system OpenSSL.
keychain-linux = [
    "dep:secret-service",
    "secret-service/rt-tokio",
    "secret-service/crypto-rust",
]
keychain-age = []

[dependencies]
secrecy = { workspace = true }
zeroize = { workspace = true }
chacha20poly1305 = { workspace = true }
rusqlite = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Platform-specific keychain backends
secret-service = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

# security-framework builds only for Apple targets, so the optional dep is
# target-gated: enabling keychain-macos elsewhere selects nothing.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, optional = true }
