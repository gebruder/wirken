[package]
name = "wirken-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Encrypted credential vault for Wirken: XChaCha20-Poly1305 at rest, OS-keychain-keyed, with per-credential rotation metadata."

[features]
default = ["keychain-age"]
keychain-macos = ["dep:security-framework"]
keychain-linux = ["dep:secret-service"]
keychain-age = []

[dependencies]
secrecy = { workspace = true }
zeroize = { workspace = true }
chacha20poly1305 = { workspace = true }
rusqlite = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Platform-specific keychain backends
security-framework = { workspace = true, optional = true }
secret-service = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
