[workspace]
resolver = "2"
members = [
    "crates/vault",
    "crates/audit",
    "crates/ipc",
    "crates/gateway",
    "crates/adapter-core",
    "crates/adapter-telegram",
    "crates/adapter-discord",
    "crates/adapter-slack",
    "crates/adapter-teams",
    "crates/adapter-matrix",
    "crates/adapter-whatsapp",
    "crates/adapter-signal",
    "crates/adapter-imessage",
    "crates/adapter-google-chat",
    "crates/agent",
    "crates/mcp-proxy",
    "crates/cli",
    "crates/skill-store",
    "crates/webchat",
    "crates/zirkel",
]

[workspace.package]
version = "1.7.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/gebruder/wirken"
description = "Team-scale AI agent orchestration with per-channel process isolation, encrypted credential vault, and per-session hash-chained audit log."

[workspace.dependencies]
# Internal crates referenced via workspace.dependencies so each crate's
# Cargo.toml carries `foo.workspace = true` rather than duplicating the
# relative path. Single source of truth for path and version.
wirken-adapter-core = { path = "crates/adapter-core" }

# Async runtime
tokio = { version = "1.52", features = ["full"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
reqwest-eventsource = "0.6"

# SQLite
rusqlite = { version = "0.39", features = ["bundled"] }

# Crypto
chacha20poly1305 = "0.10"
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
rand = "0.10"

# Keychain
security-framework = "3.7"
secret-service = "5.1"

# IPC
capnp = "0.25"

# Sandbox. Pinned >=45 per RUSTSEC-2026-0149 (wasmtime-wasi
# path_open(TRUNCATE) bypasses FilePerms::WRITE; fixed in 44.0.2 /
# 45.0.0).
wasmtime = "45.0.0"
bollard = "0.21"

# CLI
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"

# Rate limiting
governor = "0.10"

# LRU cache (used by the agent factory)
lru = "0.18"

# OAuth2 client (used by the MCP proxy for HTTP MCP servers with OAuth-protected endpoints)
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }

# Open URLs in the user's default browser (used by `wirken mcp authorize`)
open = "5"

# Async trait sugar (used by the MCP proxy's AuthProvider abstraction)
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JWT verification primitives. We do not pull `jsonwebtoken` because
# it transitively depends on `rsa` (RUSTSEC-2023-0071, Marvin Attack
# timing sidechannel, no patched versions). Both inbound JWT
# verifiers (Google Chat, Bot Framework / Teams) only verify
# RSASSA-PKCS1-v1_5 signatures with public key components, which
# `ring::signature::RsaPublicKeyComponents` covers without `rsa`.
ring = "0.17"
base64 = "0.22"

# Channel SDKs
teloxide = { version = "0.17", features = ["macros"] }
serenity = "0.12"
slack-morphism = { version = "2.22", features = ["hyper"] }


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Testing
tempfile = "3"

# Time
chrono = { version = "0.4", features = ["serde"] }
cron = "0.16"

# Error handling
thiserror = "2"
anyhow = "1"

# OpenSSL (vendored for static musl builds — pulled by serenity/teloxide via reqwest 0.12)
openssl = { version = "0.10", features = ["vendored"] }
