[[source]]
class = "legislative"
name = "congress-gov"
host = "api.congress.gov"
method = "json-congress-bill"
endpoint = "https://api.congress.gov/v3/bill?sort=updateDate+desc&limit=20&format=json"
auth = "api_key_required"
notes = "Free key. Run `wirken zirkel auth-set --source congress-gov` once. Default endpoint returns the 20 most recently updated bills; adjust limit / add filters per the v3 API docs."

[[source]]
class = "legislative"
name = "govinfo-gov"
host = "api.govinfo.gov"
method = "json-govinfo-bills"
endpoint = "https://api.govinfo.gov/collections/BILLS/2026-01-01T00:00:00Z?offsetMark=*&pageSize=20"
auth = "api_key_required"
notes = "Free key. Run `wirken zirkel auth-set --source govinfo-gov` once. Update the lastModifiedStartDate in the URL (the timestamp segment) when the operator wants a different cutoff; hearing transcripts (CHRG collection) require a separate source entry with the matching method."

