[advisories]
version = 2
ignore = [
    # rustls-webpki CRL distribution point matching issue (low impact,
    # requires CA compromise). Pinned by serenity 0.12 via rustls 0.22;
    # no upstream fix available yet.
    "RUSTSEC-2026-0049",
    # rustls-webpki name-constraint bugs in the 0.102.x branch.
    # Upstream is unpatched: the advisory lists 0.103.12 as the first
    # patched version, and there is no 0.102.x backport. rustls-webpki
    # 0.102.8 reaches wirken only via rustls 0.22.4 -> tokio-tungstenite
    # 0.21 -> serenity 0.12.5 -> wirken-adapter-discord, and serenity
    # 0.12.5 is the latest stable release (no 0.13.x exists yet). Both
    # bugs require CA misissuance of a name-constrained certificate to
    # exploit; the Discord adapter only connects to hardcoded Discord
    # endpoints (gateway.discord.gg, discord.com, cdn.discordapp.com)
    # served by standard commercial CAs that do not issue name-
    # constrained certificates for Discord's domains. The rustls 0.23
    # branch (reqwest, hyper-rustls) is already on the patched
    # rustls-webpki 0.103.12 via Cargo.lock.
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102.x is unpatched upstream and only reaches wirken via rustls 0.22 -> serenity 0.12 (Discord). Discord endpoints are not served by name-constrained CAs, so the URI-name-constraint bug cannot be triggered on this path. Revisit when serenity 0.13 releases with rustls 0.23." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102.x is unpatched upstream and only reaches wirken via rustls 0.22 -> serenity 0.12 (Discord). Discord endpoints are not served by name-constrained CAs, so the wildcard-name-constraint bug cannot be triggered on this path. Revisit when serenity 0.13 releases with rustls 0.23." },
    { id = "RUSTSEC-2026-0104", reason = "Reachable panic in CRL parsing (BorrowedCertRevocationList::from_der). The 0.103.x instance is patched via cargo update to 0.103.13. The residual 0.102.8 instance reaches wirken only via rustls 0.22 -> serenity 0.12 (Discord); serenity does not configure CRL validation and Discord endpoints are not distributed via CRL-bearing PKI, so from_der is not invoked on this path. No upstream 0.102.x backport; revisit when serenity 0.13 releases with rustls 0.23." },
    { id = "RUSTSEC-2023-0071", reason = "Marvin Attack in the rsa crate affects RSA private-key operations (signing, decryption) observable via network timing. wirken reaches rsa only through jsonwebtoken's RS256 verify path, which performs public-key operations (signature verification) that are not affected by Marvin. RSA private keys are used only in dev-deps (adapter-teams and adapter-google-chat tests) for synthetic JWT generation; those paths never run in production and are not network-observable. Revisit when rsa crate ships a constant-time implementation or jsonwebtoken switches to a non-rsa backend." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "ring" },
    # Tinfoil confidential-inference SDK. AGPL-3.0 only reaches wirken
    # through the agent crate's `tinfoil` provider arm; wirken's source
    # is public on GitHub, so the AGPL §5 corresponding-source obligation
    # is satisfied automatically. §13 (network-use source disclosure)
    # keys on operator modification of the program, not on us.
    { allow = ["AGPL-3.0"], crate = "tinfoil" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Tinfoil SDK is git-only; no crates.io publication yet. Pinned to
    # tag v0.0.4 in crates/agent/Cargo.toml.
    "https://github.com/tinfoilsh/tinfoil-rs",
    # Temporary patch source while PR #19 (relax `time` upper bound) is
    # pending upstream. See `[patch.\"https://github.com/tinfoilsh/...\"]`
    # in Cargo.toml and remove this entry alongside the patch once
    # upstream merges and re-tags.
    "https://github.com/d-a-v-i--/tinfoil-rs",
]
