[advisories]
version = 2
ignore = [
    # rustls-webpki CRL distribution point matching issue (low impact,
    # requires CA compromise). Pinned by serenity 0.12 via rustls 0.22;
    # no upstream fix available yet.
    "RUSTSEC-2026-0049",
    # rand 0.8.5 unsoundness when log + thread_rng re-enter. Only
    # triggers with a custom logger that calls rand::rng() from inside
    # a log callback. We do not define a custom logger. Pinned at 0.8
    # by cap-rand (wasmtime), oauth2, and serenity's tungstenite.
    { id = "RUSTSEC-2026-0097", reason = "rand 0.8 pinned by transitive deps; re-entrant logger condition does not apply" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "ring" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
