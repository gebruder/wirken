# Optional-feature dependencies are part of what this repo locks, so
# they are part of what gets checked. Without this, cargo-deny builds
# its graph from default features only, and a crate reachable solely
# through an optional feature is absent from the graph rather than
# cleared by it. RUSTSEC-2026-0221 sat unreported that way: event-listener
# arrives via the vault's optional keychain-linux feature
# (secret-service -> zbus -> async-broadcast), which no default build
# enables, so the advisory never had a package to attach to.
[graph]
all-features = true

[advisories]
version = 2
# Unsoundness is denied, at every depth. The default leaves this class
# unreported, which is how RUSTSEC-2026-0221 passed twice over: once for
# being outside the graph (see [graph] above) and again for being
# informational = "unsound". Either gap alone was enough to keep it
# quiet, so both are closed; neither closes it by itself.
unsound = "all"
# A yanked crate errors rather than warns. A warning does not fail the
# pre-flight, which is the same as not having the check during a
# release: chacha20 0.10.0 sat yanked under the vault's AEAD and the
# gate said so in passing.
yanked = "deny"
# Every entry names the dependency path `cargo tree --invert` resolves
# today and the reason the advisory does not apply on that path. A
# reason that cannot be checked against the graph is not a reason: one
# entry here used to cite `jsonwebtoken`, which is not a dependency of
# this workspace and has not been one, and it would have passed review
# indefinitely. Re-derive these when the lockfile moves.
ignore = [
    # rustls-webpki 0.102.8, reached only by:
    #   rustls 0.22.4 -> tokio-rustls 0.25.0 / tungstenite 0.21.0
    #     -> tokio-tungstenite 0.21.0 -> serenity 0.12.5
    #     -> wirken-adapter-discord -> wirken-cli
    # serenity 0.12 enables `rustls_backend` by default, so this is a
    # compiled path, not merely a locked one. The 0.103.x instance in
    # the lock (0.103.15, under rustls 0.23 for reqwest/hyper-rustls)
    # is past every patched range below. No 0.102.x backport exists
    # upstream and serenity 0.12.5 is the latest stable release, so
    # all four are revisitable when serenity ships a release on
    # rustls 0.23.
    { id = "RUSTSEC-2026-0049", reason = "CRL distribution-point matching: only the first distributionPoint is checked, so a correctly supplied CRL may not be consulted. Not reachable on this path because no CRL is supplied on it. `CertRevocationList` and `with_crls` appear in zero files across serenity 0.12.5, tokio-tungstenite 0.21.0, tungstenite 0.21.0 and tokio-rustls 0.25.0, so the matching logic never runs. Revisit if serenity configures revocation checking, or on serenity with rustls 0.23." },
    { id = "RUSTSEC-2026-0098", reason = "URI name constraints were ignored rather than enforced. rustls-webpki implements no API for asserting URI names, so nothing on this path can present one. Name constraints also restrict otherwise properly-issued certificates and are evaluated only after signature verification, so exploiting this needs a CA in the client trust store to misissue a name-constrained certificate. Revisit on serenity with rustls 0.23." },
    { id = "RUSTSEC-2026-0099", reason = "A permitted-subtree DNS name constraint was accepted for a certificate asserting a wildcard name. Same precondition as RUSTSEC-2026-0098: reachable only after signature verification and only against a name-constrained certificate a trusted CA misissued. Revisit on serenity with rustls 0.23." },
    { id = "RUSTSEC-2026-0104", reason = "Panic in BorrowedCertRevocationList::from_der / OwnedCertRevocationList::from_der on an empty BIT STRING in onlySomeReasons, reachable before the CRL signature is verified. The advisory states applications that do not use CRLs are unaffected, and nothing on this path parses one: `CertRevocationList` and `from_der` are never called through serenity, tokio-tungstenite, tungstenite or tokio-rustls. Revisit if serenity configures revocation checking, or on serenity with rustls 0.23." },

    # rsa 0.9.10, reached only by:
    #   wirken-agent -> tinfoil v0.1.1 (git) -> sev 7.1.0 -> rsa
    #   wirken-agent -> tinfoil v0.1.1 (git) -> rsa
    # sev pulls rsa only under its `crypto_nossl` feature, the
    # pure-Rust SEV-SNP certificate-chain verifier tinfoil enables.
    { id = "RUSTSEC-2023-0071", reason = "The Marvin Attack is a timing sidechannel in RSA private-key operations (decryption and signing). Only public-key verification is reachable here: sev's crypto_nossl path uses rsa::RsaPublicKey with rsa::pss::VerifyingKey and rsa::signature::Verifier to check the SEV-SNP certificate chain, and tinfoil uses RsaPublicKey with Pkcs1v15Sign the same way. RsaPrivateKey, pss::SigningKey, pkcs1v15::SigningKey, Pkcs1v15Encrypt, Oaep and decrypt appear in zero files across both trees. The rsa crate has no patched release. Revisit if sev or tinfoil grows a private-key operation, or when rsa ships a constant-time implementation." },

    # proc-macro-error2 2.0.1, reached only by:
    #   aquamarine 0.6.0 (proc-macro) -> teloxide 0.17.0
    #     -> wirken-adapter-telegram -> wirken-cli
    { id = "RUSTSEC-2026-0173", reason = "Unmaintained advisory, informational rather than a vulnerability. proc-macro-error2 is a proc-macro crate, so it runs in the compiler and contributes no code to the shipped binary. teloxide 0.17 is the current release and there is no version of it without aquamarine. Revisit when teloxide or aquamarine drops the dependency." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "ring" },
    # Tinfoil confidential-inference SDK. AGPL-3.0 only reaches wirken
    # through the agent crate's `tinfoil` provider arm; wirken's source
    # is public on GitHub, so the AGPL §5 corresponding-source obligation
    # is satisfied automatically. §13 (network-use source disclosure)
    # keys on operator modification of the program, not on us.
    { allow = ["AGPL-3.0"], crate = "tinfoil" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Tinfoil SDK is git-only; no crates.io publication yet. Pinned by
    # tag in crates/agent/Cargo.toml.
    "https://github.com/tinfoilsh/tinfoil-rs",
]
