# Optional-feature dependencies are part of what this repo locks, so
# they are part of what gets checked. Without this, cargo-deny builds
# its graph from default features only, and a crate reachable solely
# through an optional feature is absent from the graph rather than
# cleared by it. RUSTSEC-2026-0221 sat unreported that way: event-listener
# arrives via the vault's optional keychain-linux feature
# (secret-service -> zbus -> async-broadcast), which no default build
# enables, so the advisory never had a package to attach to.
[graph]
all-features = true

[advisories]
version = 2
# Unsoundness is denied, at every depth. The default leaves this class
# unreported, which is how RUSTSEC-2026-0221 passed twice over: once for
# being outside the graph (see [graph] above) and again for being
# informational = "unsound". Either gap alone was enough to keep it
# quiet, so both are closed; neither closes it by itself.
unsound = "all"
# A yanked crate errors rather than warns. A warning does not fail the
# pre-flight, which is the same as not having the check during a
# release: chacha20 0.10.0 sat yanked under the vault's AEAD and the
# gate said so in passing.
yanked = "deny"
# Every entry names the dependency path `cargo tree --invert` resolves
# today and the reason the advisory does not apply on that path. A
# reason that cannot be checked against the graph is not a reason: one
# entry here used to cite `jsonwebtoken`, which is not a dependency of
# this workspace and has not been one, and it would have passed review
# indefinitely. Re-derive these when the lockfile moves.
ignore = [
    # rustls-webpki 0.102.8, reached only by:
    #   rustls 0.22.4 -> tokio-rustls 0.25.0 / tungstenite 0.21.0
    #     -> tokio-tungstenite 0.21.0 -> serenity 0.12.5
    #     -> wirken-adapter-discord -> wirken-cli
    # serenity 0.12 enables `rustls_backend` by default, so this is a
    # compiled path, not merely a locked one. The 0.103.x instance in
    # the lock (0.103.16, under rustls 0.23 for reqwest/hyper-rustls)
    # is past every patched range below. No 0.102.x backport exists
    # upstream and serenity 0.12.5 is the latest stable release, so
    # all five are revisitable when serenity ships a release on
    # rustls 0.23.
    { id = "RUSTSEC-2026-0049", reason = "CRL distribution-point matching: only the first distributionPoint is checked, so a correctly supplied CRL may not be consulted. Not reachable on this path because no CRL is supplied on it. `CertRevocationList` and `with_crls` appear in zero files across serenity 0.12.5, tokio-tungstenite 0.21.0, tungstenite 0.21.0 and tokio-rustls 0.25.0, so the matching logic never runs. Revisit if serenity configures revocation checking, or on serenity with rustls 0.23." },
    { id = "RUSTSEC-2026-0098", reason = "URI name constraints were ignored rather than enforced. rustls-webpki implements no API for asserting URI names, so nothing on this path can present one. Name constraints also restrict otherwise properly-issued certificates and are evaluated only after signature verification, so exploiting this needs a CA in the client trust store to misissue a name-constrained certificate. Revisit on serenity with rustls 0.23." },
    { id = "RUSTSEC-2026-0099", reason = "A permitted-subtree DNS name constraint was accepted for a certificate asserting a wildcard name. Same precondition as RUSTSEC-2026-0098: reachable only after signature verification and only against a name-constrained certificate a trusted CA misissued. Revisit on serenity with rustls 0.23." },
    { id = "RUSTSEC-2026-0104", reason = "Panic in BorrowedCertRevocationList::from_der / OwnedCertRevocationList::from_der on an empty BIT STRING in onlySomeReasons, reachable before the CRL signature is verified. The advisory states applications that do not use CRLs are unaffected, and nothing on this path parses one: `CertRevocationList` and `from_der` are never called through serenity, tokio-tungstenite, tungstenite or tokio-rustls. Revisit if serenity configures revocation checking, or on serenity with rustls 0.23." },
    { id = "RUSTSEC-2026-0382", reason = "Certificate path validation may accept a path through one of the distrusted emSign intermediates. Reachable only from the Discord adapter: rustls-webpki 0.102.8 is on the serenity path above and on no other, so the exposure is the Discord gateway and REST connections validating a chain a distrusted intermediate signed. No 0.102.x fix exists; the fix starts at 0.103.16, which the rest of the tree runs. Moving serenity off rustls 0.22 is held until the upgraded adapter passes a live Discord round-trip. Revisit on that upgrade." },

    # rustls 0.22.4, on the same path as the rustls-webpki entries above:
    #   rustls 0.22.4 -> tokio-rustls 0.25.0 / tungstenite 0.21.0
    #     -> tokio-tungstenite 0.21.0 -> serenity 0.12.5
    #     -> wirken-adapter-discord -> wirken-cli
    # Added 2026-10-18. The rustls 0.23 instance is on 0.23.46, past both
    # patched ranges. rustls 0.22.4 is in the v2.1.0 Cargo.lock, so this
    # exposure predates 2.2.0. The Discord adapter runs in its own OS
    # process, `wirken adapter discord`, spawned by the gateway.
    # serenity 0.12.5 (2025-12-20) is the latest release and
    # tokio-tungstenite 0.21 has no compatible update off rustls 0.22, so
    # both are revisitable on a serenity release off rustls 0.22.
    { id = "RUSTSEC-2026-0346", reason = "Derived Debug impls on Tls12ClientSessionValue and Tls13ClientSessionValue print the TLS 1.2 master secret or TLS 1.3 resumption PSK, which leaks only through a custom ClientSessionStore that formats session values with Debug; the built-in session cache is redacted and unaffected. Not reachable on this path: tungstenite 0.21.0 and tokio-tungstenite 0.21.0 build their client config with ClientConfig::builder().with_root_certificates(..).with_no_client_auth(), which keeps the built-in cache, and ClientSessionStore appears in zero files across serenity 0.12.5, tokio-tungstenite 0.21.0, tungstenite 0.21.0 and tokio-rustls 0.25.0. Revisit on a serenity release off rustls 0.22." },
    { id = "RUSTSEC-2026-0349", reason = "The client records the key-exchange group from an unauthenticated ServerHello and predicts it on later connections to that name, so an attacker can steer it off a post-quantum hybrid group (X25519MLKEM768) to classical X25519, losing post-quantum confidentiality. Not reachable on this path: rustls 0.22.4 is built here with the ring provider only, whose groups are X25519, secp256r1 and secp384r1, and the 0.22.4 source has no ML-KEM or Kyber group, so every connection on this path is classical already and there is no hybrid group to lose. Revisit on a serenity release off rustls 0.22." },

    # webpki-roots 0.26.11, reached by:
    #   wirken-agent -> tinfoil v0.1.1 (git)
    #   tokio-tungstenite 0.21.0 -> serenity 0.12.5
    #     -> wirken-adapter-discord -> wirken-cli
    # 0.26.11 is a shim: its whole lib.rs is
    # `pub use parent::TLS_SERVER_ROOTS;`, with `parent` the webpki-roots
    # 1.x the lockfile resolves. Re-derive when the lockfile moves.
    { id = "RUSTSEC-2026-0381", reason = "Bundled root certificates allow trust in distrusted emSign intermediates. Not reachable as shipped: webpki-roots 0.26.11 holds no roots of its own; it re-exports the webpki-roots 1.x the lockfile resolves, currently 1.0.10, which carries the fix. Pulled in by tinfoil (pinned git dependency) and by tokio-tungstenite 0.21 under serenity. Revisit when either depends on webpki-roots 1.x directly." },

    # rsa 0.9.10, reached only by:
    #   wirken-agent -> tinfoil v0.1.1 (git) -> sev 7.1.0 -> rsa
    #   wirken-agent -> tinfoil v0.1.1 (git) -> rsa
    # sev pulls rsa only under its `crypto_nossl` feature, the
    # pure-Rust SEV-SNP certificate-chain verifier tinfoil enables.
    { id = "RUSTSEC-2023-0071", reason = "The Marvin Attack is a timing sidechannel in RSA private-key operations (decryption and signing). Only public-key verification is reachable here: sev's crypto_nossl path uses rsa::RsaPublicKey with rsa::pss::VerifyingKey and rsa::signature::Verifier to check the SEV-SNP certificate chain, and tinfoil uses RsaPublicKey with Pkcs1v15Sign the same way. RsaPrivateKey, pss::SigningKey, pkcs1v15::SigningKey, Pkcs1v15Encrypt, Oaep and decrypt appear in zero files across both trees. The rsa crate has no patched release. Revisit if sev or tinfoil grows a private-key operation, or when rsa ships a constant-time implementation." },

    # proc-macro-error2 2.0.1, reached only by:
    #   aquamarine 0.6.0 (proc-macro) -> teloxide 0.17.0
    #     -> wirken-adapter-telegram -> wirken-cli
    { id = "RUSTSEC-2026-0173", reason = "Unmaintained advisory, informational rather than a vulnerability. proc-macro-error2 is a proc-macro crate, so it runs in the compiler and contributes no code to the shipped binary. teloxide 0.17 is the current release and there is no version of it without aquamarine. Revisit when teloxide or aquamarine drops the dependency." },

    # zip 8.6.0, used only by wirken-gateway (`cargo tree -i zip` with all
    # features shows no other dependent), in
    # crates/gateway/src/imported_archive.rs. Added 2026-10-18. That file
    # opens archives with ZipArchive::new and hands members to callers
    # through a capped reader over by_index_raw and by_name; ZipWriter
    # appears only in its tests. It calls neither ZipArchive::extract nor
    # ZipStreamReader::extract, the functions all three advisories concern,
    # and writes no file or link from an archive entry. All three are
    # revisitable when zip 9.0.0 is adopted through #287.
    { id = "RUSTSEC-2026-0367", reason = "SUID, SGID and sticky bits from external_attributes are kept when ZipArchive::extract or the stream extraction API writes files. Wirken calls neither; crates/gateway/src/imported_archive.rs reads members through a reader and creates no file from them. Revisit when zip 9.0.0 is adopted (#287)." },
    { id = "RUSTSEC-2026-0368", reason = "ZipArchive::extract creates symbolic links whose targets point outside the destination directory. Wirken never calls extract and creates no link from an archive entry; crates/gateway/src/imported_archive.rs reads member contents through a reader. Revisit when zip 9.0.0 is adopted (#287)." },
    { id = "RUSTSEC-2026-0369", reason = "ZipStreamReader::extract and ZipArchive::extract apply Unix permissions through extracted symlinks without confining the target. Wirken uses no ZipStreamReader and calls no extract; crates/gateway/src/imported_archive.rs sets no permission from an archive. Revisit when zip 9.0.0 is adopted (#287)." },

    # zbus_names 4.3.1, zvariant 5.10.0 and zvariant_derive 5.10.0, reached
    # only by:
    #   zbus 5.14.0 -> secret-service 5.2.0 -> wirken-vault (keychain-linux)
    # Added 2026-10-18. keychain-linux is optional and off in default and
    # release builds. secret-service 5.2.0 is its latest release. Each
    # crate was merged into zbus 6.0.0, so all three are revisitable when
    # secret-service releases on zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "Unmaintained advisory, not a known vulnerability: zvariant was merged into zbus 6.0.0 as its wire module. Reached only through zbus 5.14.0 under secret-service 5.2.0, behind wirken-vault's optional keychain-linux feature. Revisit when secret-service releases on zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "Unmaintained advisory, not a known vulnerability: zbus_names was merged into zbus 6.0.0 as its names module. Reached only through zbus 5.14.0 under secret-service 5.2.0, behind wirken-vault's optional keychain-linux feature. Revisit when secret-service releases on zbus 6." },
    { id = "RUSTSEC-2026-0372", reason = "Unmaintained advisory, not a known vulnerability: zvariant_derive's macros moved into zbus 6.0.0. A proc-macro crate, so it contributes no code to a binary, reached only through zvariant 5.10.0 and zbus 5.14.0 under secret-service 5.2.0, behind wirken-vault's optional keychain-linux feature. Revisit when secret-service releases on zbus 6." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "ring" },
    # Tinfoil confidential-inference SDK. AGPL-3.0 only reaches wirken
    # through the agent crate's `tinfoil` provider arm; wirken's source
    # is public on GitHub, so the AGPL §5 corresponding-source obligation
    # is satisfied automatically. §13 (network-use source disclosure)
    # keys on operator modification of the program, not on us.
    { allow = ["AGPL-3.0"], crate = "tinfoil" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Tinfoil SDK is git-only; no crates.io publication yet. Pinned by
    # tag in crates/agent/Cargo.toml.
    "https://github.com/tinfoilsh/tinfoil-rs",
]
