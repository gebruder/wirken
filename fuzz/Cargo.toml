# Its own workspace, not a member of the wirken one. cargo-fuzz builds
# with nightly, `-Z sanitizer=address` and a `libfuzzer-sys` dependency
# that nothing else in the tree should inherit, and keeping it separate
# means `cargo build --workspace` on stable is unaffected.
[package]
name = "wirken-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
capnp = "0.27"
tokio = { version = "1", features = ["rt", "io-util", "macros"] }

wirken-agent = { path = "../crates/agent" }
wirken-gateway = { path = "../crates/gateway" }
wirken-ipc = { path = "../crates/ipc" }

[[bin]]
name = "ipc_frame_decode"
path = "fuzz_targets/ipc_frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exec_classifier"
path = "fuzz_targets/exec_classifier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "skill_frontmatter"
path = "fuzz_targets/skill_frontmatter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "injection_scan"
path = "fuzz_targets/injection_scan.rs"
test = false
doc = false
bench = false

# Fuzzers are built with debug assertions so an overflow or a violated
# `debug_assert!` in the code under test is a crash rather than a
# silent wrap, and with symbols so a crash names a frame.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

# A fuzz target's own workspace root.
[workspace]
