version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR per batch instead of one per crate. Two reasons, both
    # observed: sibling crates that share an API surface (wasmtime and
    # wasmtime-wasi) do not compile when bumped separately, and every
    # merge of a lockfile-touching PR invalidates the rest of the
    # queue, so a batch of N costs N rebase cycles.
    #
    # Security updates keep their own group so a routine bump that
    # fails CI cannot hold an advisory fix behind it.
    groups:
      cargo-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # rusqlite 0.40+ pulls libsqlite3-sys 0.38, whose build.rs calls
      # cfg_select!. That was nightly-only when this ignore was added
      # and broke `cargo build` on stable with E0658; reverted twice
      # (09dafd9, 04e5665), both times after merging on green PR CI.
      #
      # cfg_select! is stable as of Rust 1.95.0, so the compile error is
      # gone. The ignore stays because the bump now raises the effective
      # MSRV to 1.95 while docs/getting-started.md promises 1.85+, and
      # an auto-proposed bump would land that floor change unannounced.
      # Remove it in the same commit that raises the documented floor.
      # See issue #149.
      - dependency-name: "rusqlite"
        versions: [">= 0.40"]
      # tinfoil 0.2 returns an http client whose errors are
      # `reqwest_middleware::Error` wrapping the `reqwest::Error` that
      # 0.1 returned directly, so `is_pinned_tls_failure` in
      # crates/agent/src/llm.rs no longer compiles against it.
      #
      # That predicate decides whether to drop the cached attested
      # `tinfoil::Client` and re-attest, so widening the signature
      # without reaching the inner reqwest error would stop a
      # pinned-TLS connect failure from invalidating the cache and
      # leave a stale pinned transport in place. The adaptation needs
      # a test proving invalidation still fires, which is not work an
      # auto-proposed bump should carry.
      #
      # 0.2 also pulls `tinfoil-ehbp` from
      # github.com/tinfoilsh/encrypted-http-body-protocol at a bare rev
      # rather than a tag, which is a second git source and is not in
      # the `deny.toml` sources allowlist, so `cargo deny` rejects the
      # tree. Lifting this hold therefore also means vetting that repo
      # and adding it alongside the existing tinfoil-rs entry, not just
      # adapting the predicate.
      #
      # Remove this in the same commit that adapts the predicate and
      # allowlists the new source.
      - dependency-name: "tinfoil"
        versions: [">= 0.2"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
