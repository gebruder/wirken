version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR per batch instead of one per crate. Two reasons, both
    # observed: sibling crates that share an API surface (wasmtime and
    # wasmtime-wasi) do not compile when bumped separately, and every
    # merge of a lockfile-touching PR invalidates the rest of the
    # queue, so a batch of N costs N rebase cycles.
    #
    # Security updates keep their own group so a routine bump that
    # fails CI cannot hold an advisory fix behind it.
    groups:
      cargo-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Both costs below start inside the 0.1.x line, not at 0.2, so
      # there is no compatible patch release to take here.
      #
      # v0.1.2: `Client::http_client()` returns `&tls::OriginBoundClient`
      # instead of `&reqwest::Client`. `OriginBoundClient` wraps
      # `reqwest_middleware::ClientWithMiddleware`, so its errors are
      # `reqwest_middleware::Error` and `is_pinned_tls_failure` in
      # crates/agent/src/llm.rs no longer compiles against it.
      #
      # That predicate decides whether to drop the cached attested
      # `tinfoil::Client` and re-attest, so widening the signature
      # without reaching the inner reqwest error would stop a
      # pinned-TLS connect failure from invalidating the cache and
      # leave a stale pinned transport in place. The adaptation needs
      # a test proving invalidation still fires, which is not work an
      # auto-proposed bump should carry.
      #
      # v0.1.4: pulls `tinfoil-ehbp` from
      # github.com/tinfoilsh/encrypted-http-body-protocol at a bare rev
      # rather than a tag. That is a second git source and is not in the
      # `deny.toml` sources allowlist, so `cargo deny` rejects the tree.
      #
      # Resume condition, all three: adapt `is_pinned_tls_failure` to
      # `OriginBoundClient`; vet the encrypted-http-body-protocol repo
      # and allowlist it in `deny.toml` `[sources]` beside tinfoil-rs;
      # review the `sev` 7 to 8 bump, which moves the crate that verifies
      # SEV-SNP attestation. Remove this entry in that same commit.
      #
      # No `versions:` bound below: tinfoil is a git dependency, so
      # Dependabot carries its version as a commit SHA and a semver
      # range never matches it. An unbounded ignore is the only form
      # that holds here.
      #
      # It is unbounded in both directions: this suppresses the 0.1.x
      # line as well as 0.2, and upstream carries tags past the pinned
      # one that will not be proposed while this entry stands. No
      # security coverage is lost, since tinfoil has no crates.io
      # release for an advisory to reference, but compatible patch
      # releases now have to be taken deliberately rather than offered.
      #
      # What replaces Dependabot for this crate: watch the tags on
      # github.com/tinfoilsh/tinfoil-rs and move the pin by hand.
      # `deny.toml` `[sources] allow-git` is the backstop, failing the
      # build if the tree gains a git source that is not allowlisted.
      - dependency-name: "tinfoil"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
