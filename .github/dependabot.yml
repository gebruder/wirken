version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR per batch instead of one per crate. Two reasons, both
    # observed: sibling crates that share an API surface (wasmtime and
    # wasmtime-wasi) do not compile when bumped separately, and every
    # merge of a lockfile-touching PR invalidates the rest of the
    # queue, so a batch of N costs N rebase cycles.
    #
    # Security updates keep their own group so a routine bump that
    # fails CI cannot hold an advisory fix behind it.
    groups:
      cargo-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # rusqlite 0.40+ pulls libsqlite3-sys 0.38, whose build.rs calls
      # cfg_select!. That was nightly-only when this ignore was added
      # and broke `cargo build` on stable with E0658; reverted twice
      # (09dafd9, 04e5665), both times after merging on green PR CI.
      #
      # cfg_select! is stable as of Rust 1.95.0, so the compile error is
      # gone. The ignore stays because the bump now raises the effective
      # MSRV to 1.95 while docs/getting-started.md promises 1.85+, and
      # an auto-proposed bump would land that floor change unannounced.
      # Remove it in the same commit that raises the documented floor.
      # See issue #149.
      - dependency-name: "rusqlite"
        versions: [">= 0.40"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
