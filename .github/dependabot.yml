version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR per batch instead of one per crate. Two reasons, both
    # observed: sibling crates that share an API surface (wasmtime and
    # wasmtime-wasi) do not compile when bumped separately, and every
    # merge of a lockfile-touching PR invalidates the rest of the
    # queue, so a batch of N costs N rebase cycles.
    #
    # Security updates keep their own group so a routine bump that
    # fails CI cannot hold an advisory fix behind it.
    groups:
      cargo-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # rusqlite 0.40+ pulls libsqlite3-sys 0.38, whose build.rs uses
      # cfg_select! (nightly-only) and breaks `cargo build` on stable
      # with E0658. See issue #149. Reverted twice (09dafd9, 04e5665).
      # Remove this ignore to re-attempt once cfg_select stabilizes on
      # stable or libsqlite3-sys backs it out.
      - dependency-name: "rusqlite"
        versions: [">= 0.40"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
