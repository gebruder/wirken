name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27
      # cargo-deny from its GitHub release with the SHA-256 checked before
      # it runs, as gitleaks.yml installs gitleaks. The cargo-deny action
      # builds a container from a Docker Hub base image, and Docker Hub's
      # unauthenticated pull limit failed this job on shared runners. Same
      # version the action pinned (0.20.2) and the same arguments.
      - name: Install cargo-deny
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          VERSION=0.20.2
          NAME="cargo-deny-${VERSION}-x86_64-unknown-linux-musl"
          EXPECTED_SHA256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}/${NAME}.tar.gz" \
            -o "${NAME}.tar.gz"

          echo "${EXPECTED_SHA256}  ${NAME}.tar.gz" | sha256sum -c -

          tar -xzf "${NAME}.tar.gz" "${NAME}/cargo-deny"
          install -m 0755 "${NAME}/cargo-deny" "${HOME}/.cargo/bin/cargo-deny"
          cargo deny --version
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27
        with:
          components: clippy
      - name: Install Cap'n Proto
        run: sudo apt-get install -y capnproto
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Every `unsafe` block carries a SAFETY comment stating the
      # invariant that makes it sound. Run as its own step so the
      # failure names itself: clippy points at the block and the fix
      # is either the comment or safe code, never a suppression.
      - name: SAFETY comment on every unsafe block
        run: cargo clippy --workspace --all-targets -- -D clippy::undocumented_unsafe_blocks

      # The Win32 peer-credential path in crates/ipc is behind
      # `cfg(windows)`, so the Linux run above never sees its unsafe
      # blocks. wirken-ipc is the only crate with `cfg(windows)`
      # unsafe, and it is small enough to check for that target here.
      - name: Install the Windows target
        run: rustup target add x86_64-pc-windows-gnu
      - name: SAFETY comment on the Windows-gated unsafe blocks
        run: |
          cargo clippy -p wirken-ipc --all-targets \
            --target x86_64-pc-windows-gnu \
            -- -D clippy::undocumented_unsafe_blocks

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27
      - name: Install Cap'n Proto
        run: sudo apt-get install -y capnproto
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace

  corpus:
    name: Hostile corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27
      - name: Install Cap'n Proto
        run: sudo apt-get install -y capnproto
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-corpus-${{ hashFiles('**/Cargo.lock') }}
      # The test job above already runs this binary as part of the
      # workspace. It runs again here on its own because a corpus
      # mismatch prints the call and both outcomes, and that report is
      # worth having in a job of its own rather than three thousand
      # test lines deep in another one. A red check named "Hostile
      # corpus" also says what broke before anyone opens the log.
      - name: Replay tests/hostile/corpus.jsonl
        run: cargo test -p wirken-agent --test hostile_corpus -- --nocapture

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins a stable release; this job needs nightly,
    # and RUSTUP_TOOLCHAIN takes precedence over the file.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-fuzz needs nightly: libFuzzer arrives through
      # `-Z sanitizer`, which is not on stable.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
      - name: Install Cap'n Proto
        run: sudo apt-get install -y capnproto
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/cargo-fuzz
            fuzz/target/
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.toml', '**/Cargo.lock') }}
      # The cache above restores `~/.cargo/bin/cargo-fuzz`, and
      # `cargo install` refuses to overwrite an existing binary rather
      # than treating it as already done. So the install runs on a cold
      # cache and is skipped on a warm one. `--force` would work and
      # would rebuild cargo-fuzz from source on every push, which is
      # most of this job's wall clock.
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked
      # Sixty seconds per target on every push. That is not a fuzzing
      # campaign; it is a tripwire that the committed corpus still
      # passes and that a change did not open a shallow crash. Long
      # runs happen off CI.
      #
      # A crash is a finding about the code under test. The fix is
      # never to relax the target's assertions or drop the input from
      # the corpus: `fuzz/artifacts/` keeps the reproducer and the job
      # stays red until the code is fixed.
      - name: Fuzz each target for 60 seconds
        run: |
          set -e
          for target in exec_classifier skill_frontmatter injection_scan ipc_frame_decode; do
            echo "::group::$target"
            cargo fuzz run "$target" -- -max_total_time=60 -print_final_stats=1
            echo "::endgroup::"
          done
        working-directory: fuzz

  miri:
    name: Miri
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins a stable release; Miri ships only on
    # nightly, and RUSTUP_TOOLCHAIN takes precedence over the file.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: miri, rust-src
      # wirken-ipc's build script compiles the Cap'n Proto schema.
      - name: Install Cap'n Proto
        run: sudo apt-get install -y capnproto
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
      # Builds the standard library Miri interprets against, so a
      # failure here is the toolchain's and not a test's.
      - name: Set up Miri
        run: cargo miri setup
      # The crates that hold `unsafe` (CONTRIBUTING.md, Miri). A test
      # Miri cannot run carries `#[cfg_attr(miri, ignore = "...")]` with
      # the reason; it is never deleted to turn this job green.
      - name: Miri, wirken-ipc
        run: cargo miri test --locked -p wirken-ipc
      - name: Miri, wirken-mcp-proxy
        run: cargo miri test --locked -p wirken-mcp-proxy

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The export schema extractor is stdlib-only by design, so this
      # job installs nothing: no setup-python, no pip, no lockfile. The
      # runner's own python3 is the same interpreter an operator runs
      # the extractor with, which is the thing worth testing.
      #
      # Warnings are errors so an unclosed handle or a deprecation fails
      # here rather than accumulating unread in the log.
      - name: Extractor gate tests
        run: python3 -W error::ResourceWarning scripts/test_anthropic_export_schema.py

      # Its companion, on the same terms and for the same property: the
      # message-field reporter prints sizes rather than values, so a
      # run against a real archive is safe to paste.
      - name: Message-field reporter gate tests
        run: python3 -W error::ResourceWarning scripts/test_anthropic_export_message_fields.py

      # Checks on the text of Rust source. They are lints, not tests,
      # and the first one is what keeps them out of the test binary: a
      # `#[test]` that greps a `.rs` file breaks on a rename that
      # changed nothing and passes on a rewrite that broke everything,
      # while reading as behavioural coverage.
      - name: Source lints
        run: python3 -W error::ResourceWarning scripts/source_lints.py

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The floor is written once, in Cargo.toml `rust-version`. Read it
      # here rather than repeating it, so the job cannot drift from what
      # the manifest promises. Empty means the field was renamed or
      # dropped, which fails the job instead of silently testing nothing.
      - id: floor
        run: |
          v=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$v" ]; then
            echo "no rust-version found in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Pinned to the floor itself, not `stable`. This job exists to prove
      # the `rust-version` in Cargo.toml is real, so it has to run on that
      # exact toolchain; on `stable` it would prove nothing.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ steps.floor.outputs.version }}
      - name: Install Cap'n Proto
        run: sudo apt-get install -y capnproto
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
      # rust-toolchain.toml would otherwise select its own version over
      # the one installed above.
      - run: cargo check --workspace --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.floor.outputs.version }}
