# OSSF Scorecard — supply-chain / security-posture baseline.
# Uses a third-party action; see its own terms.
#
# Scored checks land in the Security tab as SARIF and (for public
# repos) published to the OpenSSF REST API so the Scorecard badge
# works. The Branch-Protection check reads admin settings via the
# GitHub API — it requires a fine-grained PAT saved as the
# `SCORECARD_TOKEN` repository secret with read access to repo
# administration and metadata. Without it, that check scores 0.

name: Scorecard supply-chain security

on:
  # Re-run when branch protection changes so the check reflects current state.
  branch_protection_rule:
  # Weekly baseline so the "Maintained" check stays fresh.
  schedule:
    - cron: '31 12 * * 4'
  # And every push to main.
  push:
    branches: [ "main" ]

# Read-only by default; each job escalates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # `publish_results: true` only works from the default branch.
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      # Upload SARIF to the code-scanning dashboard.
      security-events: write
      # Publish results and mint a signed badge.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Branch-Protection check needs repo-admin read; this token is
          # a fine-grained PAT scoped to metadata + administration: read,
          # saved as `SCORECARD_TOKEN`. If the secret is missing the
          # action still runs but that one check scores 0.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # Public repo: publish to the OpenSSF REST API so the badge works.
          # Private repos force this to false regardless.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning dashboard
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
