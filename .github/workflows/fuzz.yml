name: Fuzz

on:
  pull_request:
    paths:
      - 'crates/audit/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Mondays 06:17 UTC. Off-peak; non-blocking.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-fuzz:
    name: cargo fuzz session_event (60s)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly as of 2026-06-30
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run session_event target
        working-directory: crates/audit
        run: cargo fuzz run session_event -- -max_total_time=60
