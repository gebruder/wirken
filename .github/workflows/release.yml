name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      gate_only:
        description: Run only the tag gate, not the build matrix
        type: boolean
        default: false

# Minimum permissions at the workflow level. The release job
# escalates to `contents: write` locally so build jobs can't use
# the token to push to the repo even if compromised.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Upstream Cap'n Proto release, pinned. Bumping the version
  # means recording the new archive's sha256 here as well; the
  # install refuses a mismatch.
  CAPNP_VERSION: "1.3.0"
  CAPNP_SHA256: "2c503361f8bf26fa9e7caccb6db04d6b271d5f0ad3da0616cf40e9a51335c89c"

jobs:
  # The tag gate. Every build job needs it, so when it fails nothing is
  # built and no draft release is created. A surface the token cannot
  # read is printed as UNVERIFIED and fails the job: an unread surface
  # is not a clean one. `workflow_dispatch` with `gate_only` runs this
  # job alone, on any branch; a dispatched run never creates a release.
  gate:
    name: Tag gate
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, and the commit range check-names reads
      security-events: read # code-scanning alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-names reads the commits since the last tag.
          fetch-depth: 0

      - name: Names
        run: scripts/check-names.sh

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27
        if: ${{ !cancelled() }}

      # The same pinned, checksummed cargo-deny the CI Deny job installs.
      - name: Install cargo-deny
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          VERSION=0.20.2
          NAME="cargo-deny-${VERSION}-x86_64-unknown-linux-musl"
          EXPECTED_SHA256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}/${NAME}.tar.gz" \
            -o "${NAME}.tar.gz"

          echo "${EXPECTED_SHA256}  ${NAME}.tar.gz" | sha256sum -c -

          tar -xzf "${NAME}.tar.gz" "${NAME}/cargo-deny"
          install -m 0755 "${NAME}/cargo-deny" "${HOME}/.cargo/bin/cargo-deny"
          cargo deny --version

      - name: cargo deny
        if: ${{ !cancelled() }}
        run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check

      # A closed advisory needs a `### Security` heading, or releases.json
      # says the release carries no security fix. Needs the full history
      # for the previous tag, which the checkout above fetches.
      - name: Security heading
        if: ${{ !cancelled() }}
        run: scripts/check-security-heading.py

      # Code scanning gates on CodeQL; Scorecard findings are reviewed,
      # not gating (docs/release-process.md). Dependabot alerts are not
      # read here: the workflow token cannot be granted them, so they
      # stay in the manual pre-flight, run with the maintainer's account.
      - name: Open CodeQL alerts
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          fail=0
          err=$(mktemp)

          if found=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&per_page=100" \
              --jq '.[] | select(.rule.security_severity_level == "critical" or .rule.security_severity_level == "high")
                    | "  #\(.number) \(.rule.security_severity_level) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' \
              2>"$err"); then
            if [ -n "$found" ]; then
              echo "code scanning: open critical or high CodeQL alerts"
              echo "$found"
              fail=1
            else
              echo "code scanning: no open critical or high CodeQL alert"
            fi
          else
            echo "code scanning: UNVERIFIED, the token cannot read it: $(cat "$err")"
            fail=1
          fi

          exit "$fail"

  build-linux:
    name: Build Linux (${{ matrix.target }})
    needs: [gate]
    if: ${{ !inputs.gate_only }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }} -p wirken-cli

      - name: Strip binary
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            docker run --rm -v "$(pwd)":/work -w /work messense/rust-musl-cross:x86_64-musl \
              strip target/${{ matrix.target }}/release/wirken
          else
            docker run --rm -v "$(pwd)":/work -w /work messense/rust-musl-cross:aarch64-musl \
              strip target/${{ matrix.target }}/release/wirken || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wirken-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wirken

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: [gate]
    if: ${{ !inputs.gate_only }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27
        with:
          targets: ${{ matrix.target }}

      # The action adds the target to the toolchain it installed; cargo
      # builds with the one rust-toolchain.toml names, so add it there.
      - name: Add target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install Cap'n Proto compiler
        run: brew install capnp

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p wirken-cli

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/wirken

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wirken-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wirken

  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    needs: [gate]
    if: ${{ !inputs.gate_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27
        with:
          targets: x86_64-pc-windows-msvc

      # The action adds the target to the toolchain it installed; cargo
      # builds with the one rust-toolchain.toml names, so add it there.
      - name: Add target to the pinned toolchain
        run: rustup target add x86_64-pc-windows-msvc

      # See `windows-smoke.yml` for why this is not
      # `choco install capnproto -y`. A release build in particular
      # must not be able to proceed with a silently absent toolchain.
      - name: Cache Cap'n Proto
        id: capnp-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: capnp-tools
          key: capnp-${{ runner.os }}-${{ env.CAPNP_VERSION }}-${{ env.CAPNP_SHA256 }}

      - name: Install Cap'n Proto
        if: steps.capnp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://capnproto.org/capnproto-c++-win32-$env:CAPNP_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile capnp.zip
          $got = (Get-FileHash capnp.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:CAPNP_SHA256) {
            Write-Host "capnp archive checksum mismatch"
            Write-Host "  expected $env:CAPNP_SHA256"
            Write-Host "  got      $got"
            exit 1
          }
          Expand-Archive -Path capnp.zip -DestinationPath capnp-extract -Force
          New-Item -ItemType Directory -Force -Path capnp-tools | Out-Null
          Copy-Item "capnp-extract/capnproto-tools-win32-$env:CAPNP_VERSION/*" `
            -Destination capnp-tools -Recurse -Force

      - name: Add Cap'n Proto to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$PWD\capnp-tools"

      - name: Verify Cap'n Proto
        shell: pwsh
        run: |
          capnp --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "capnp is not runnable after install"
            exit 1
          }

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p wirken-cli

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wirken-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/wirken.exe

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    # Only run on tag push — workflow_dispatch has no tag to attach
    # the draft release to, and we use it just for verifying the
    # build matrix.
    if: github.event_name == 'push'
    permissions:
      # Needed by softprops/action-gh-release to create the draft.
      contents: write
    outputs:
      # base64 of checksums.sha256, consumed by the `provenance` job as
      # the SLSA subjects to attest. Covers exactly the published
      # binaries (the checksum file is computed over `wirken-*`).
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect binaries and generate checksums
        run: |
          # Each artifact zip contains the cargo-output binary name
          # (`wirken` on Unix, `wirken.exe` on Windows). Stage them
          # into release/ under the verbose-suffix name install.sh
          # expects (`wirken-${TARGET}` on Unix,
          # `wirken-x86_64-pc-windows-msvc.exe` on Windows). The
          # artifact zips themselves keep clean inner filenames so a
          # user who downloads one directly gets `wirken[.exe]`
          # without needing to rename.
          mkdir -p release
          for dir in artifacts/wirken-*/; do
            triple="${dir#artifacts/wirken-}"
            triple="${triple%/}"
            if [ -f "${dir}wirken.exe" ]; then
              cp "${dir}wirken.exe" "release/wirken-${triple}.exe"
            else
              cp "${dir}wirken" "release/wirken-${triple}"
            fi
          done
          cd release
          sha256sum wirken-* > checksums.sha256
          cat checksums.sha256
          cd ..
          ls -la release/

      - name: Export subjects for SLSA provenance
        id: hashes
        # The provenance job attests these exact sha256 subjects. The
        # checksum file is the same one the maintainer signs offline, so
        # the two trust roots cover identical bytes.
        run: echo "hashes=$(base64 -w0 release/checksums.sha256)" >> "$GITHUB_OUTPUT"

      # Release is created as a draft. The maintainer downloads
      # checksums.sha256 from the draft, signs it offline with the
      # Ed25519 release signing key (see docs/signing.md), and
      # uploads checksums.sha256.sig to the draft before publishing.
      # CI does not hold the signing key. Those steps live in
      # docs/release-process.md, not in the release body: the body is
      # the generated notes only, so publishing the draft publishes
      # nothing that describes it as a draft.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SLSA Build L3 provenance over the published binaries. Produces a
  # standalone `wirken.intoto.jsonl` attestation, signed via the GitHub
  # OIDC-rooted Sigstore chain, attached to the draft release next to
  # `checksums.sha256` and `checksums.sha256.sig`. This is a second,
  # independent trust root (build-origin via a transparency log) beside
  # the offline-maintainer ed25519 signature; the two compose and
  # neither substitutes for the other. Verify with `slsa-verifier`
  # (see docs/signing.md).
  #
  # This reusable workflow is pinned by release TAG, not by commit SHA:
  # the generator verifies that it was itself invoked at a semantic tag
  # to anchor its own provenance, so a SHA ref is rejected. This is a
  # deliberate, documented exception to this repo's SHA-pin policy, not
  # an oversight; the scorecard Pinned-Dependencies check may flag it.
  provenance:
    name: Provenance
    needs: [release]
    if: github.event_name == 'push'
    permissions:
      id-token: write # OIDC token for Sigstore signing
      contents: write # attach the attestation to the release
      actions: read # read workflow run metadata for the provenance
    # Referenced by version tag, not a commit SHA, on purpose: the SLSA
    # generator resolves its own ref to produce provenance and rejects a
    # hash reference. Do not "pin" this to a SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      provenance-name: wirken.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
      # Keep the release a draft: the maintainer still attaches the
      # offline signature and publishes by hand. String type per the
      # generator's input schema.
      draft-release: "true"
