name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Minimum permissions at the workflow level. The release job
# escalates to `contents: write` locally so build jobs can't use
# the token to push to the repo even if compromised.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }} -p wirken-cli

      - name: Strip binary
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            docker run --rm -v "$(pwd)":/work -w /work messense/rust-musl-cross:x86_64-musl \
              strip target/${{ matrix.target }}/release/wirken
          else
            docker run --rm -v "$(pwd)":/work -w /work messense/rust-musl-cross:aarch64-musl \
              strip target/${{ matrix.target }}/release/wirken || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wirken-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wirken

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27
        with:
          targets: ${{ matrix.target }}

      - name: Install Cap'n Proto compiler
        run: brew install capnp

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p wirken-cli

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/wirken

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wirken-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wirken

  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-03-27
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Cap'n Proto
        run: choco install capnproto -y

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p wirken-cli

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wirken-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/wirken.exe

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    # Only run on tag push — workflow_dispatch has no tag to attach
    # the draft release to, and we use it just for verifying the
    # build matrix.
    if: github.event_name == 'push'
    permissions:
      # Needed by softprops/action-gh-release to create the draft.
      contents: write
    outputs:
      # base64 of checksums.sha256, consumed by the `provenance` job as
      # the SLSA subjects to attest. Covers exactly the published
      # binaries (the checksum file is computed over `wirken-*`).
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect binaries and generate checksums
        run: |
          # Each artifact zip contains the cargo-output binary name
          # (`wirken` on Unix, `wirken.exe` on Windows). Stage them
          # into release/ under the verbose-suffix name install.sh
          # expects (`wirken-${TARGET}` on Unix,
          # `wirken-x86_64-pc-windows-msvc.exe` on Windows). The
          # artifact zips themselves keep clean inner filenames so a
          # user who downloads one directly gets `wirken[.exe]`
          # without needing to rename.
          mkdir -p release
          for dir in artifacts/wirken-*/; do
            triple="${dir#artifacts/wirken-}"
            triple="${triple%/}"
            if [ -f "${dir}wirken.exe" ]; then
              cp "${dir}wirken.exe" "release/wirken-${triple}.exe"
            else
              cp "${dir}wirken" "release/wirken-${triple}"
            fi
          done
          cd release
          sha256sum wirken-* > checksums.sha256
          cat checksums.sha256
          cd ..
          ls -la release/

      - name: Export subjects for SLSA provenance
        id: hashes
        # The provenance job attests these exact sha256 subjects. The
        # checksum file is the same one the maintainer signs offline, so
        # the two trust roots cover identical bytes.
        run: echo "hashes=$(base64 -w0 release/checksums.sha256)" >> "$GITHUB_OUTPUT"

      # Release is created as a draft. The maintainer downloads
      # checksums.sha256 from the draft, signs it offline with the
      # Ed25519 release signing key (see docs/release-signing.md), and
      # uploads checksums.sha256.sig to the draft before publishing.
      # CI does not hold the signing key.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          body: |
            **This release is a draft until `checksums.sha256.sig` is attached.**

            The installer verifies `checksums.sha256.sig` against the
            embedded release signing key. Publishing a release without
            the signature will break `install.sh` for all users who do
            not set `WIRKEN_ALLOW_UNVERIFIED=1`.

            Maintainer steps before publishing:

            1. Download `checksums.sha256` from this draft.
            2. `WIRKEN_SIGNING_KEY=/secure/path scripts/sign-release.sh <tag>`
            3. Upload `checksums.sha256.sig` to this draft.
            4. Publish the release.

            See `docs/release-signing.md` for the full procedure.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SLSA Build L3 provenance over the published binaries. Produces a
  # standalone `wirken.intoto.jsonl` attestation, signed via the GitHub
  # OIDC-rooted Sigstore chain, attached to the draft release next to
  # `checksums.sha256` and `checksums.sha256.sig`. This is a second,
  # independent trust root (build-origin via a transparency log) beside
  # the offline-maintainer ed25519 signature; the two compose and
  # neither substitutes for the other. Verify with `slsa-verifier`
  # (see docs/release-signing.md).
  #
  # This reusable workflow is pinned by release TAG, not by commit SHA:
  # the generator verifies that it was itself invoked at a semantic tag
  # to anchor its own provenance, so a SHA ref is rejected. This is a
  # deliberate, documented exception to this repo's SHA-pin policy, not
  # an oversight; the scorecard Pinned-Dependencies check may flag it.
  provenance:
    name: Provenance
    needs: [release]
    if: github.event_name == 'push'
    permissions:
      id-token: write # OIDC token for Sigstore signing
      contents: write # attach the attestation to the release
      actions: read # read workflow run metadata for the provenance
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      provenance-name: wirken.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
      # Keep the release a draft: the maintainer still attaches the
      # offline signature and publishes by hand. String type per the
      # generator's input schema.
      draft-release: "true"
