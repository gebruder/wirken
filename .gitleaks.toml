# gitleaks configuration for wirken.
#
# Extends the default rule set from https://github.com/gitleaks/gitleaks.
# The allowlist below covers intentional test fixtures and
# pre-reviewed constants that the default rules would otherwise
# flag on every run.

[extend]
useDefault = true

[allowlist]
description = "wirken test fixtures and pre-reviewed constants"

# File paths that are expected to contain material matching the
# default rules. Each entry is a regex anchored to the repo root.
paths = [
  # Static RSA keypairs used only inside #[cfg(test)] JWT tests.
  # Generated offline via `openssl genrsa -traditional 2048` with
  # the explicit intent of being test-only. See the embedded
  # constants in adapter-teams / adapter-google-chat tests.rs.
  '''crates/adapter-teams/src/test_rsa_.*\.pem$''',
  '''crates/adapter-google-chat/src/test_rsa_.*\.pem$''',

  # Self-reference: the commit-msg hook and this config document the
  # identity strings they are supposed to reject, by necessity.
  '''scripts/git-hooks/commit-msg$''',
  '''\.gitleaks\.toml$''',
]

# Regex patterns that should NOT trip even when they appear
# outside the allowlisted paths. Scoped narrowly.
regexes = [
  # WhatsApp adapter test HMAC secret. Already annotated in code
  # with `// CodeQL:hardcoded-credential-ok`; mirror that here.
  '''whatsapp_test_hmac_key''',

  # WhatsApp setup test fixture (commit 18297d2) — sequential hex
  # secret used in channel.rs::tests to exercise validate_app_secret.
  # Superseded in the working tree by low-entropy fixtures, but
  # still present in history and flagged by generic-api-key.
  '''0123456789abcdef0123456789abcdef''',

  # The name of the cipher used by the vault crate. Appears in
  # the crate description and ambient docs; the generic-api-key
  # rule matches on its entropy. `XChaCha20-Poly1305` is a
  # published algorithm identifier, not a secret.
  '''XChaCha20-Poly1305''',

  # Release signing key PUBLIC fingerprint shown as example
  # output in docs/release-signing.md. The fingerprint is
  # intentionally public — it's what readers verify releases
  # against. gitleaks extracts the base64 portion after the
  # `SHA256:` prefix as its secret value, so the allowlist
  # matches that extracted form.
  '''tzlfNHy4G1KIsmAR\+cM3MGwVndheh2ak/usA6rw7SuE''',
]

# Non-canonical ottenheimer.app identities. davi@ottenheimer.app is
# the only allowed form for gebruder repos. gebruder@ottenheimer.app
# has leaked via GitHub squash-merge Co-authored-by attribution;
# this rule catches regressions in diffs or messages.
[[rules]]
id = "internal-email-leak"
description = "Non-canonical ottenheimer.app email"
regex = '''gebruder@ottenheimer\.app'''
tags = ["identity", "leak"]

# Absolute home paths leak local checkout layout. Commit 5ff35e0
# scrubbed the release runbook; docs and configs should use $REPO
# or a relative path.
[[rules]]
id = "home-path-leak"
description = "Absolute home path in tracked content"
regex = '''/(home|Users)/davi/'''
tags = ["path", "leak"]
